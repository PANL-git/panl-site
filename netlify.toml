# Netlify reconstruit le site à chaque commit (dont ceux faits par Pages CMS).
[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# pan-l.fr et pan-l.com (et www.panl.fr, déjà géré par Netlify) renvoient vers l'adresse principale.
[[redirects]]
  from = "https://pan-l.fr/*"
  to = "https://panl.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.pan-l.fr/*"
  to = "https://panl.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://pan-l.com/*"
  to = "https://panl.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.pan-l.com/*"
  to = "https://panl.fr/:splat"
  status = 301
  force = true
